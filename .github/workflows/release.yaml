name: Release
on:
  release:
    types: [published]
jobs:
  release_zip_file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["GITHUB_WORKSPACE"]) / "custom_components/homeconnect_ws/manifest.json"
          data = json.loads(path.read_text())
          data["version"] = os.environ["VERSION"].lower()
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - run: |
          cd ${{ github.workspace }}/custom_components/homeconnect_ws
          zip homeconnect_ws.zip -r ./
      - uses: softprops/action-gh-release@v2.5.0
        with:
          files: ${{ github.workspace }}/custom_components/homeconnect_ws/homeconnect_ws.zip
